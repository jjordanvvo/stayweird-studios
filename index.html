<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stay Weird Studios</title>
<meta name="description" content="Stay Weird Studios: clothing.">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="has-hero">
<main>
<section class="hero">
  <div class="ph ph--dark"><img src="/images/hero.jpg" alt="Stay Weird Studios campaign" style="object-position:50% 14%" onerror="this.style.display='none'"></div>
  <h1 class="hero__mark"><img src="/images/wordmark-white.png" alt="Stay Weird Studios"></h1>
  <a class="hero__link" href="/shop">Shop All</a>
</section>

<section class="block">
  <h2 class="block__title">New Releases</h2>
  <div class="grid" id="home-grid"></div>
</section>

<section class="hero">
  <div class="ph ph--dark"><img src="/images/hero-2.jpg" alt="Stay Weird Studios campaign" onerror="this.style.display='none'"></div>
  <a class="hero__link" href="/shop">Shop Now</a>
</section>
</main>
<script src="/assets/products.js"></script>
<script src="/assets/app.js"></script>
<script>
  document.getElementById("home-grid").innerHTML =
    SW_PRODUCTS.filter(p => p.collections.includes("new-items")).slice(0, 8).map(SW_card).join("");
  if (SW_PRODUCTS.length === 3) document.getElementById("home-grid").classList.add("grid--3");
</script>
</body>
</html>
