<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Stay Weird Studios</title>
<meta name="description" content="Shop Stay Weird Studios.">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main>
<div class="coll">
  <h1 class="coll__title" id="coll-title">Shop All</h1>
  <div class="grid" id="coll-grid"></div>
</div>
</main>
<script src="/assets/products.js"></script>
<script src="/assets/app.js"></script>
<script>
  const c = new URLSearchParams(location.search).get("c") || "shop-all";
  const coll = SW_COLLECTIONS.find(x => x.id === c) || SW_COLLECTIONS[0];
  document.getElementById("coll-title").textContent = coll.name;
  document.title = coll.name + " | Stay Weird Studios";
  const list = SW_PRODUCTS.filter(p => coll.id === "shop-all" || p.collections.includes(coll.id));
  document.getElementById("coll-grid").innerHTML = list.length ? list.map(SW_card).join("") : '<p class="empty">Nothing here yet</p>';
</script>
</body>
</html>
