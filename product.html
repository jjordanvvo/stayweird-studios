<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product | Stay Weird Studios</title>
<meta name="description" content="Stay Weird Studios product.">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main>
<div class="pdp" id="pdp"></div>
<section class="fbt" id="fbt"></section>
<section class="recs"><h2>You may also like</h2><div class="grid" id="recs"></div></section>
<section class="reviews">
  <h2>Customer Reviews</h2>
  <div class="reviews__row">
    <div><div class="stars" aria-label="No reviews yet">☆☆☆☆☆</div><small>Be the first to write a review</small></div>
    <button class="btn btn--case" id="write-review">Write a review</button>
  </div>
</section>
</main>
<script src="/assets/products.js"></script>
<script src="/assets/app.js"></script>
<script>
(function () {
  const I = SW_ICONS, money = SW_money, esc = SW_esc;
  const id = new URLSearchParams(location.search).get("id");
  const p = SW_PRODUCTS.find(x => x.id === id) || SW_PRODUCTS[0];
  document.title = p.name + " | Stay Weird Studios";
  const n = SW_imgCount(p), out = SW_soldOut(p);
  let size = p.sizes.find(s => !p.soldOut.includes(s));

  document.getElementById("pdp").innerHTML = `
    <div><div class="pdp__gallery" data-slides>${Array.from({ length: n }, (_, i) => SW_media(p, i)).join("")}</div>${SW_dots(n)}</div>
    <div class="pdp__info">
      <div class="pdp__head"><h1>${esc(p.name)}</h1><span class="price">${SW_price(p)}</span></div>
      <div class="sizes" id="sizes" role="radiogroup" aria-label="Size">${p.sizes.map(s =>
        `<button role="radio" data-s="${esc(s)}" ${p.soldOut.includes(s) ? "disabled" : ""} class="${s === size ? "sel" : ""}" aria-checked="${s === size}">${esc(s)}</button>`).join("")}</div>
      <button class="btn" id="atc" ${out ? "disabled" : ""}>${out ? "Sold out" : "Add to cart"}</button>
      <div class="acc">
        <details><summary>Description ${I.down}</summary><div class="acc__body">${esc(p.description || "")}</div></details>
        <details><summary>Shipping details ${I.down}</summary><div class="acc__body">Orders ship within 3–5 business days. Free shipping on orders over $${SW_SETTINGS.freeShipping}. Returns and exchanges accepted within 14 days on unworn items.</div></details>
        <details><summary>Size guide ${I.down}</summary><div class="acc__body"><table>
          <tr><th>Size</th><th>Chest</th><th>Length</th></tr><tr><td>XS</td><td>20"</td><td>26"</td></tr><tr><td>S</td><td>21"</td><td>27"</td></tr>
          <tr><td>M</td><td>22"</td><td>28"</td></tr><tr><td>L</td><td>23"</td><td>29"</td></tr><tr><td>XL</td><td>24"</td><td>30"</td></tr></table></div></details>
      </div>
    </div>`;

  document.getElementById("sizes").addEventListener("click", e => {
    const b = e.target.closest("button[data-s]"); if (!b || b.disabled) return;
    document.querySelectorAll("#sizes button").forEach(x => { x.classList.remove("sel"); x.setAttribute("aria-checked", "false"); });
    b.classList.add("sel"); b.setAttribute("aria-checked", "true"); size = b.dataset.s;
  });
  document.getElementById("atc").addEventListener("click", () => SW_addToCart(p.id, size));

  // Frequently bought together: this product + one from the other category, with a bundle discount
  const pair = SW_PRODUCTS.find(x => x.id !== p.id && !SW_soldOut(x) &&
    x.collections.includes(p.collections.includes("tops") ? "bottoms" : "tops"));
  if (pair && !out) {
    const disc = SW_SETTINGS.bundleDiscount, items = [p, pair];
    const opts = x => x.sizes.filter(s => !x.soldOut.includes(s)).map(s => `<option>${esc(s)}</option>`).join("");
    const row = (x, i) => `<label class="fbt__item"><input type="checkbox" checked data-fbt="${i}">${SW_media(x, 0, "thumb")}
      <div><div class="fbt__name">${esc(x.name)}${i ? "" : ' <span class="fbt__meta">(this item)</span>'}</div>
      <select data-fbt-size="${i}" aria-label="Size">${opts(x)}</select>
      <div class="fbt__price"><span class="sale">${money(x.price * (1 - disc))}</span><span class="was">${money(x.price)}</span></div></div></label>`;
    const fbt = document.getElementById("fbt");
    fbt.innerHTML = `<h2>Frequently bought together</h2>${row(p, 0)}${row(pair, 1)}<button class="btn btn--case" id="fbt-btn"></button>`;
    const checked = i => fbt.querySelector(`[data-fbt="${i}"]`).checked;
    const upd = () => {
      const s = items.filter((_, i) => checked(i)), full = s.reduce((t, x) => t + x.price, 0);
      const b = document.getElementById("fbt-btn");
      b.disabled = !s.length;
      b.innerHTML = s.length ? `Claim Offer • ${money(full * (1 - disc))} <span class="was" style="color:#aaa;margin-left:6px">${money(full)}</span>` : "Select an item";
    };
    fbt.addEventListener("change", upd); upd();
    document.getElementById("fbt-btn").addEventListener("click", () => {
      items.forEach((x, i) => { if (checked(i)) SW_addToCart(x.id, fbt.querySelector(`[data-fbt-size="${i}"]`).value, 1, false); });
      document.querySelector('[data-open="cart"]').click();
    });
  }

  const main = c => ["tops", "bottoms"].includes(c);
  const others = SW_PRODUCTS.filter(x => x.id !== p.id);
  const recs = [...new Set([...others.filter(x => !x.collections.some(c => main(c) && p.collections.includes(c))), ...others])].slice(0, 2);
  document.getElementById("recs").innerHTML = recs.map(SW_card).join("");
  document.getElementById("write-review").addEventListener("click", () => SW_toast("Reviews will turn on once the store backend is set up"));
})();
</script>
</body>
</html>
